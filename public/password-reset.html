<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <title>%PAGE_TITLE%</title>
  <meta name="description" content="%PAGE_DESCRIPTION%" />
  <meta name="theme-color" content="#193b66" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/redesign.css" />
</head>
<body>
  <main class="login-screen">
    <div class="login-layout">
      <div class="login-story">
        <div class="login-story-head">
          <div class="brand-mark"><img src="/assets/logo-light.svg" alt="EVARA BNS" class="brand-logo" /></div>
          <div class="login-story-actions">
            <button type="button" class="quote-toggle" data-quote-toggle aria-label="Pause sayings" title="Pause sayings">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path class="quote-pause-icon" d="M7 5h3v14H7zm7 0h3v14h-3z"/><path class="quote-play-icon" d="m8 5 11 7-11 7z"/></svg>
            </button>
            <button type="button" class="language-toggle login-language-toggle" data-language-toggle>English</button>
          </div>
        </div>
        <p class="login-kicker" data-i18n="login.kicker">The people workspace</p>
        <h1 class="rotating-quote" data-rotating-quote aria-live="off">
          <span class="quote-line">خطوة صغيرة اليوم،</span>
          <span class="quote-line">فرق كبير غدًا.</span>
        </h1>
        <p class="story-copy" data-i18n="login.storyCopy">Attendance, requests and team insights, all together in a workspace built for your day.</p>
      </div>
      <section class="login-card password-recovery-card" aria-labelledby="recoveryTitle">
        <h2 id="recoveryTitle"></h2>
        <p id="recoveryCopy" class="recovery-copy"></p>
        <p id="recoveryStatus" class="form-alert hidden" role="status" aria-live="polite"></p>
        <form id="recoveryRequestForm" class="stack-form hidden">
          <div class="form-group">
            <label for="recoveryEmail" data-i18n="login.emailLabel">Email Address</label>
            <input id="recoveryEmail" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" dir="ltr" placeholder="name@company.com" required />
          </div>
          <button id="recoverySendBtn" type="submit" class="btn btn-primary btn-block" data-i18n="recovery.sendLink">Send reset link</button>
        </form>
        <form id="recoveryUpdateForm" class="stack-form hidden">
          <input id="recoveryAccount" type="text" name="username" autocomplete="username" hidden readonly />
          <div class="form-group">
            <label for="recoveryPassword" data-i18n="recovery.newPassword">New password</label>
            <input id="recoveryPassword" name="new-password" type="password" autocomplete="new-password" minlength="8" aria-describedby="recoveryPasswordHelp" required />
            <small id="recoveryPasswordHelp" class="recovery-help" data-i18n="recovery.passwordHelp"></small>
          </div>
          <div class="form-group">
            <label for="recoveryConfirm" data-i18n="recovery.confirmPassword">Confirm new password</label>
            <input id="recoveryConfirm" name="confirm-password" type="password" autocomplete="new-password" minlength="8" required />
          </div>
          <button id="recoverySaveBtn" type="submit" class="btn btn-primary btn-block" data-i18n="recovery.savePassword">Save new password</button>
        </form>
        <a href="/" class="login-recovery-link recovery-back" data-i18n="recovery.back">Back to sign in</a>
        <span class="login-footer login-contact">By/ Islam Amr</span>
      </section>
    </div>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/env.js"></script>
  <script type="module" src="/js/passwordRecovery.js"></script>
</body>
</html>
