<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>%PAGE_TITLE%</title>
  <meta name="description" content="%PAGE_DESCRIPTION%" />
  <meta name="theme-color" content="#f4f7fb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="EVARA" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="canonical" href="%PAGE_URL%" />
  <meta property="og:site_name" content="EVARA BNS" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="%PAGE_TITLE%" />
  <meta property="og:description" content="%PAGE_DESCRIPTION%" />
  <meta property="og:url" content="%PAGE_URL%" />
  <meta property="og:image" content="%OG_IMAGE_URL%" />
  <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="%PAGE_TITLE%" />
  <meta name="twitter:description" content="%PAGE_DESCRIPTION%" />
  <meta name="twitter:image" content="%OG_IMAGE_URL%" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="assets/image.png" />
  <link rel="shortcut icon" type="image/png" href="assets/image.png" />
  <link rel="apple-touch-icon" href="assets/image.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/redesign.css" />
  <link rel="stylesheet" href="css/employee.css" />
</head>
<body class="checkin-body">
  <main class="checkin-shell">
    <section class="checkin-card">
      <header class="checkin-topline">
        <div class="brand-mark checkin-brand">
          <img src="assets/image.png" alt="EVARA BNS logo" class="brand-logo" />
        </div>
        <button type="button" class="language-toggle checkin-language-toggle" data-language-toggle>العربية</button>
      </header>
      <div class="checkin-clock">
        <strong id="checkinClock">--:--</strong>
        <span id="checkinToday">--</span>
      </div>
      <div id="checkinOrb" class="checkin-orb" data-state="loading" aria-hidden="true">
        <span class="orb-wave"></span>
        <span class="orb-wave second"></span>
        <span id="checkinOrbIcon" class="orb-core"></span>
      </div>
      <div class="checkin-hero">
        <h1 id="checkinHeroTitle">Start your morning with calm focus.</h1>
        <p id="checkinHeroText" class="checkin-copy">Check in when you are ready and begin your day with clear confidence.</p>
      </div>

      <div id="checkinError" class="form-alert error hidden"></div>
      <div id="checkinNotice" class="form-alert info hidden"></div>

      <div id="checkinStatus" class="status-card compact checkin-status-card">
        <div class="checkin-status-main">
          <div class="checkin-status-topline">
            <span id="checkinStatePill" class="status-pill neutral" data-i18n="checkin.loadingButton">Loading</span>
            <span id="checkinIdentity" class="checkin-identity">--</span>
          </div>
          <span class="status-label" data-i18n="checkin.statusLabel">Attendance status</span>
          <strong id="checkinStatusTitle" data-i18n="checkin.loadingTitle">Checking your session</strong>
          <p id="checkinStatusText" data-i18n="checkin.loadingText">Please wait while we load your attendance state.</p>
          <div id="checkinStatusMeta" class="checkin-status-meta hidden"></div>
        </div>
      </div>

      <div class="checkin-actions">
        <button id="checkinActionBtn" type="button" class="btn btn-primary btn-block" data-i18n="checkin.loadingButton" disabled>Loading</button>
        <button id="checkinSecondaryBtn" type="button" class="btn btn-secondary btn-block" data-i18n="common.openDashboard">Open Dashboard</button>
      </div>
    </section>
  </main>

  <div id="checkinSuccess" class="checkin-success hidden" role="status" aria-live="assertive">
    <div class="success-mark">
      <svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg>
    </div>
    <strong id="checkinSuccessTitle"></strong>
    <span id="checkinSuccessText"></span>
  </div>

  <script src="vendor/supabase.js"></script>
  <script src="env.js"></script>
  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/checkin.js"></script>
</body>
</html>
